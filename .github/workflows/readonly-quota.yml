name: Read-only quota contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  readonly-quota:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install pytest fastapi
      - run: python tests/run_readonly_checks.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/desktop-settings.test.mjs
